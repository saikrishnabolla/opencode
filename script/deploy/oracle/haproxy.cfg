global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon
    stats socket /run/haproxy/admin.sock mode 660 level admin
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    log global
    mode tcp
    timeout connect 10s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h

frontend private_tls_sni
    bind 127.0.0.1:9443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend existing_proxy_tls if { req.ssl_sni -i personal-cloud.tail580d9e.ts.net }
    use_backend private_dashboard_tls if { req.ssl_sni -i desk.saibolla.com }

backend existing_proxy_tls
    server tailscale 100.104.4.120:8444 check

backend private_dashboard_tls
    server local_tls 127.0.0.1:9444 check

frontend private_https
    mode http
    bind 127.0.0.1:9444 ssl crt /etc/haproxy/certs/private-desktop.pem alpn h2,http/1.1
    acl desktop_host hdr(host) -i desk.saibolla.com desk.saibolla.com:443
    http-request deny deny_status 404 unless desktop_host
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]
    default_backend private_opencode_http

backend private_opencode_http
    mode http
    server opencode_web 127.0.0.1:49377 check
